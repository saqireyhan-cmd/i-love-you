<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Heart</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body> <canvas id="canvas"></canvas>
    <script> const canvas = document.getElementById("canvas"); const ctx = canvas.getContext("2d"); let width = window.innerWidth; let height = window.innerHeight; canvas.width = width; canvas.height = height; const text = "I love you"; const color = "#ffb6c1"; let points = []; let progress = 0; const speed = 1.5; function createHeart() { points = []; width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; const scale = Math.min(width, height) / 42; for (let i = 0; i < 500; i++) { const t = (i / 500) * Math.PI * 2; const x = 16 * Math.pow(Math.sin(t), 3); const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); points.push({ x: width / 2 + x * scale, y: height / 2 - y * scale }); } } function draw() { ctx.clearRect(0, 0, width, height); ctx.fillStyle = color; ctx.font = "bold 12px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; const visible = Math.floor(progress); for (let i = 0; i < visible; i++) { const point = points[i]; ctx.fillText(text, point.x, point.y); } progress += speed; if (progress > points.length) { progress = 0; } requestAnimationFrame(draw); } window.addEventListener("resize", createHeart); createHeart(); draw(); </script>
</body>

</html>
